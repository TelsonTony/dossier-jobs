# Scheduled job pipeline (Architecture v7.1 Section 5.2).
# Fetches all jobs, signs the output, and force-pushes it as a single commit to the
# gh-pages branch, which GitHub Pages serves. Never runs on pull requests, so secrets
# are never exposed to code from a fork.
name: Fetch jobs

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC). Change here; keep runs_per_day in config.json in step.
  workflow_dispatch: {}

permissions:
  contents: write   # needed only to push the gh-pages branch

concurrency:
  group: fetch-jobs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions are pinned to commit hashes. Dependabot keeps them current.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get previous published data
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            git worktree add --detach previous FETCH_HEAD
          else
            mkdir previous
          fi

      - name: Run pipeline
        env:
          DOSSIER_SIGNING_KEY: ${{ secrets.DOSSIER_SIGNING_KEY }}
          DOSSIER_SIGNING_KEY_ID: ${{ vars.DOSSIER_SIGNING_KEY_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          FINDWORK_API_KEY: ${{ secrets.FINDWORK_API_KEY }}
          THEMUSE_API_KEY: ${{ secrets.THEMUSE_API_KEY }}
        run: python -m pipeline.main --site site --previous previous

      - name: Show health report
        run: cat site/health_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Job data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
